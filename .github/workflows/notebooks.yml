name: Notebooks

# Build the Jupyter Book site (README + executed notebooks, see myst.yml).
# On main the site is published to GitHub Pages; on pull requests it is
# uploaded as a downloadable artifact. The build is strict, so the job fails
# if any notebook raises an error.

on:
  push:
    branches: [main]
    paths: ["notebooks/**", "src/**", "pyproject.toml", "README.md", "myst.yml", ".github/workflows/notebooks.yml"]
  pull_request:
    paths: ["notebooks/**", "src/**", "pyproject.toml", "README.md", "myst.yml", ".github/workflows/notebooks.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Set up Node (required by Jupyter Book 2)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # CPU-only torch avoids downloading several GB of CUDA libraries.
      - name: Install CPU-only PyTorch
        run: uv pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package and notebook tooling
        run: uv pip install . jupyter-book ipykernel matplotlib

      - name: Build Jupyter Book
        env:
          BASE_URL: /${{ github.event.repository.name }}  # Pages serves the site under /<repo>
        run: jupyter book build --html --execute --strict --ci

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

      - name: Upload preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: notebooks-html
          path: _build/html

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
